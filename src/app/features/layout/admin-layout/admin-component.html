<app-admin-header [isSidebarOpen]="isSidebarOpen"></app-admin-header>
<app-admin-sidebar 
[isOpen]="isSidebarOpen"
    (sidebarToggled)="handleSidebarStateChange($event)"
    appAutoCollapseSidebar
    [isOpen]="isSidebarOpen"
    (isOpenChange)="handleSidebarStateChange($event)"
 ></app-admin-sidebar>
<main 
class="bg-lavender dark:bg-drk-lavender mt-16  transition-all duration-300 ease-in-out"
      [ngClass]="{'ml-64': isSidebarOpen, 'ml-16': !isSidebarOpen}">
  <div class="container mx-auto ">
    <router-outlet></router-outlet>
  </div>
</main>
