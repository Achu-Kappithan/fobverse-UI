    <div class="bg-lavender min-h-screen">
      <div class="container mx-auto px-4 py-4">
        <!-- Header -->
        <header class="w-full flex justify-between items-center bg-white p-6 rounded-lg shadow-lg mb-8">
          <div class="flex items-center space-x-4">
            <h1 class="text-2xl font-bold text-dark-gray">Company Job Listings</h1>
          </div>
          <div class="flex items-center space-x-4">
            <button 
              type="button" 
              class="px-4 py-2 text-sm font-medium text-purple bg-purple-100 rounded-md hover:bg-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
              </svg>
              Back
            </button>
            <button 
              type="button" 
              class="px-4 py-2 text-sm font-medium text-white bg-purple rounded-md hover:bg-hover-purpule focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
              </svg>
              Add New Job
            </button>
          </div>
        </header>

        <!-- Table Container -->
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
          <!-- Table Header with Search and Filters -->
          <div class="p-6 border-b border-gray-300">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center space-y-4 lg:space-y-0">
              <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-4">
                <!-- Search -->
                <div class="relative">
                  <input 
                    type="text" 
                    placeholder="Search jobs..." 
                    class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500" />
                  <svg class="w-5 h-5 text-gray absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                  </svg>
                </div>

                <!-- Status Filter -->
                <select 
                  class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                  <option value="">All Status</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                  <option value="draft">Draft</option>
                  <option value="expired">Expired</option>
                </select>

                <!-- Job Type Filter -->
                <select 
                  class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                  <option value="">All Types</option>
                  <option value="fulltime">Full-Time</option>
                  <option value="parttime">Part-Time</option>
                  <option value="remote">Remote</option>
                  <option value="onsite">On-Site</option>
                </select>
              </div>

              <div class="text-sm text-gray">
                Showing <span class="font-medium text-dark-gray"></span> of
                <span class="font-medium text-dark-gray"></span> jobs
              </div>
            </div>
          </div>

          <!-- Table -->
          <div class="overflow-x-auto custom-scrollbar">
            <table class="w-full min-w-[1000px]">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    <input 
                      type="checkbox" 
                      class="rounded border-gray-300 text-purple focus:ring-purple-500" />
                  </th>
                  <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                  <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                  <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Posted Date</th>
                  <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Due Date</th>
                  <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Job Type</th>
                  <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Applications</th>
                  <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Vacancies</th>
                  <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">

                  <td colspan="9" class="px-6 py-8 text-center text-gray">
                    <div class="flex flex-col items-center">
                      <svg class="w-12 h-12 text-gray mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>

              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
