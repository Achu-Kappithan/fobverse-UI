<div class="bg-lavender font-sans">
    <div class="min-h-screen flex flex-col items-center py-10 px-4">
        <header class="w-full max-w-6xl flex justify-between items-center bg-white dark:bg-dark-lavender p-6 rounded-lg shadow-lg mb-8">
            <h1 class="text-2xl font-bold text-dark-gray dark:text-dark-text">Add New Job</h1>
            <div class="flex items-center space-x-4">
                 <button  type="button" class="px-4 py-2 text-sm font-medium text-purple-600 bg-purple-100 rounded-md hover:bg-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    Back
                </button>
               <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-purple-600 rounded-md hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Save Changes    
                </button>
            </div>
        </header>

        <main class="w-full max-w-6xl flex flex-col lg:flex-row gap-8">
            <div class="lg:w-2/3 bg-white dark:bg-dark-lavender p-8 rounded-lg shadow-lg">
                <h2 class="text-xl font-semibold text-dark-gray dark:text-dark-text mb-6">Job Details</h2>
                
                <form class="space-y-6">
                    <div>
                        <label for="title" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Job Title</label>
                        <input type="text" id="title" name="title" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-lg p-2 focus:ring-purple-500 focus:border-purple-500">
                    </div>
                    
                    <div>
                        <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Job Description</label>
                        <textarea id="description" name="description" rows="6" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-lg focus:border-purple-500 focus:ring-purple-500 sm:text-sm p-2"></textarea>
                    </div>


                </form>
                <div class=" bg-white dark:bg-dark-lavender mt-8 p-8 rounded-lg shadow-xl">
                <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-gray-800">Office Locations</h2>
            <button type="button" class="text-purple-600 hover:text-purple-800 text-sm font-medium flex items-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
              </svg>
              Add Location
            </button>
          </div>
          <div formArrayName="officeLocation" class="space-y-2">
            <div  class="flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
              </svg>
              <input type="text"  class="flex-grow border border-gray-300 rounded-md shadow-sm p-2 focus:ring-purple-500 focus:border-purple-500" placeholder="e.g., United States">
              <button type="button" class="p-1 text-red-600 hover:text-red-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm6 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd" />
                </svg>
              </button>
            </div>
            <p  class="text-sm text-gray-500">No office locations added yet.</p>
          </div>
                </div>
            </div>
            

            <div class="lg:w-1/3 space-y-8">
                <div class="bg-white dark:bg-lavender p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-semibold text-dark-gray dark:text-dark-text">Required Skills</h3>
                        <button class="text-purple-600 dark:text-purple font-medium">+ Add Skill</button>
                    </div>
                    <div class="flex flex-wrap gap-2">
                      <div formArrayName="techStack" class="flex flex-wrap gap-2">
                            <div  class="relative flex items-center bg-gray-100 rounded-md px-3 py-1 text-sm text-gray-700">
                            <input type="text" class="bg-transparent focus:outline-none focus:ring-0 w-full" placeholder="e.g., React">
                            <button  class="ml-2 text-gray-500 hover:text-gray-700">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                                </svg>
                            </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-dark-lavender p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-semibold text-dark-gray dark:text-dark-text">Experience</h3>
                        <button class="text-purple-600 dark:text-purple font-medium">+ Add Experience</button>
                    </div>
                   <div class="flex flex-wrap gap-2">
                      <div formArrayName="techStack" class="flex flex-wrap gap-2">
                            <div  class="relative flex items-center bg-gray-100 rounded-md px-3 py-1 text-sm text-gray-700">
                            <input type="text" class="bg-transparent focus:outline-none focus:ring-0 w-full" placeholder="e.g., React">
                            <button  class="ml-2 text-gray-500 hover:text-gray-700">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                                </svg>
                            </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-dark p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-semibold text-dark-gray dark:text-dark-text">Salary Range (in ₹)</h3>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div>
                            <label for="min-salary" class="block text-xs font-medium text-gray-500 dark:text-gray-400">Min Salary</label>
                            <input type="text" id="min-salary" name="salary.min" placeholder="e.g., 50000" class="mt-1 block w-full border border-gray-300 dark:text-white rounded-md shadow-lg focus:border-purple focus:ring-purple-500 sm:text-sm p-2">
                        </div>
                        <span class="text-gray-500 dark:text-gray-400 mt-5">to</span>
                        <div>
                            <label for="max-salary" class="block text-xs font-medium text-gray-500 dark:text-gray-400">Max Salary</label>
                            <input type="text" id="max-salary" name="salary.max" placeholder="e.g., 75000" class="mt-1 block w-full border border-gray-300  dark:text-white rounded-md shadow-lg focus:border-purple focus:ring-purple-500 sm:text-sm p-2">
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-dark-lavender p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-semibold text-dark-gray dark:text-dark-text">Number of Vacancies</h3>
                    </div>
                    <input type="text" id="vacancies" name="vacancies" required class="mt-1 block w-full border border-gray-300 dark:text-white rounded-md shadow-sm focus:border-purple focus:ring-purple-500 sm:text-sm p-2">
                </div>

            </div>
        </main>
    </div>
</div>
