<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4 py-2 bg-white shadow-md transition-colors duration-300 ease-in-out">
    <div class="flex items-center">
        <img src="/logo/logo.png" alt="Fobverse Logo" class="h-10 mr-4">
    </div>
    <div class="flex items-center space-x-4">
        <button (click)="toggleDarkMode()" class="p-2 rounded-full transition-colors duration-200 hover-bg-light" aria-label="Toggle dark mode">
            <i class="fas text-lg" [ngClass]="{'fa-moon text-dark-gray dark:text-dark-text': isDarkMode, 'fa-sun text-dark-gray': !isDarkMode}"></i>
        </button>
        <div class="relative profile-menu-container">
            <button (click)="toggleProfileMenu()" class="flex items-center p-2 rounded-full transition-colors duration-200 hover-bg-light">
                <img [src]="activeUser?.profileImg ? cloudinaryBaseUrl + activeUser?.profileImg:'/profileimages/defaultProfile.jpg'" alt="User Avatar" class="h-8 w-8 rounded-full">
            </button>
            <div *ngIf="isProfileMenuOpen" class="absolute right-0 mt-3 w-64 profile-dropdown-card rounded-xl shadow-xl py-2 z-50 ring-1 ring-black ring-opacity-5">
                <!-- User Info Header -->
                <div class="px-4 py-3 profile-dropdown-header mb-2">
                    <div class="flex items-center space-x-3">
                        <img [src]="activeUser?.profileImg ? cloudinaryBaseUrl + activeUser?.profileImg : '/profileimages/defaultProfile.jpg'" 
                             class="h-10 w-10 rounded-full object-cover ring-2 ring-purple-100 dark:ring-purple-900/30">
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-semibold text-gray-900 dark:text-white truncate">
                                {{ activeUser?.name }}
                            </p>
                            <p class="text-xs text-gray-500 dark:text-gray-400 truncate">
                                {{ activeUser?.email }}
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Menu Items -->
                <div class="px-2 space-y-1">
                    <a [routerLink]="['userprofile']" 
                       (click)="toggleProfileMenu()"
                       class="flex items-center px-3 py-2 text-sm profile-dropdown-item rounded-lg transition-colors duration-150 group">
                        <div class="h-8 w-8 rounded-lg profile-icon-bg flex items-center justify-center mr-3 transition-colors duration-150">
                            <i class="fas fa-user-circle text-gray-400 group-hover:text-purple-600 dark:group-hover:text-purple-400"></i>
                        </div>
                        <span class="font-medium">Profile</span>
                    </a>
                    
                    <button (click)="logOut()" 
                            class="w-full flex items-center px-3 py-2 text-sm text-red-600 dark:text-red-400 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors duration-150 group">
                        <div class="h-8 w-8 rounded-lg bg-red-50 dark:bg-gray-800 flex items-center justify-center mr-3 group-hover:bg-red-100 dark:group-hover:bg-red-900/40 transition-colors duration-150">
                            <i class="fas fa-sign-out-alt text-red-500"></i>
                        </div>
                        <span class="font-medium">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>
