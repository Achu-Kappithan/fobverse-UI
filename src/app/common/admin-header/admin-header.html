<header class="fixed h-16 top-0 left-0 right-0 z-50 flex items-center justify-between px-4 py-2 bg-white shadow-md transition-colors duration-300 ease-in-out">
  <div class="flex items-center">
    <img src="/logo/logo.png" alt="Fobverse Logo" class="h-10 mr-4">
  </div>
  <div class="flex items-center space-x-4">
    <button (click)="toggleDarkMode()" class="p-2 rounded-full transition-colors duration-200 hover:bg-purple-50" aria-label="Toggle dark mode">
      <i class="fas" [ngClass]="{'fa-moon text-gray': !isDarkMode, 'fa-sun text-white': isDarkMode}"></i>
    </button>
    <div class="relative" (appClickOutside)="isProfileMenuOpen = false">
      <button (click)="toggleProfileMenu(); $event.stopPropagation()" class="flex items-center p-2 rounded-full transition-colors duration-200 hover:bg-purple-50">
        <img [src]="activeAdmin?.profileImg ? cludBaseUrl+activeAdmin?.profileImg:'/profileimages/defaultProfile.jpg'" alt="User Avatar" class="h-8 w-8 rounded-full">
      </button>
      <div *ngIf="isProfileMenuOpen" class="absolute right-0 mt-2 w-64 rounded-xl shadow-xl z-50 overflow-hidden profile-dropdown-card">
        <!-- Modal Header -->
        <div class="px-4 py-3 profile-dropdown-header">
          <p class="text-xs font-semibold text-gray uppercase tracking-wider">Admin Account</p>
          <div class="mt-2 flex items-center">
            <img [src]="activeAdmin?.profileImg ? cludBaseUrl+activeAdmin?.profileImg:'/profileimages/defaultProfile.jpg'" alt="User Avatar" class="h-10 w-10 rounded-full border-2 border-purple">
            <div class="ml-3 overflow-hidden">
              <p class="text-sm font-bold text-dark-gray truncate">{{ activeAdmin?.name }}</p>
              <p class="text-xs text-gray truncate">{{ activeAdmin?.role || activeAdmin?.email }}</p>
            </div>
          </div>
        </div>

        <!-- Modal Links -->
        <div class="py-1">
          <a [routerLink]="['/admin/profile']" (click)="isProfileMenuOpen = false" class="flex items-center px-4 py-3 text-sm profile-dropdown-item transition-all duration-200">
            <div class="p-2 rounded-lg mr-3 profile-icon-bg">
              <i class="fas fa-user-circle"></i>
            </div>
            <span class="font-medium">My Profile</span>
          </a>
          
          <div class="h-px bg-divider mx-4 my-1"></div>

          <a (click)="logoutUser()" class="flex items-center px-4 py-3 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 cursor-pointer transition-all duration-200">
            <div class="p-2 rounded-lg mr-3 bg-red-50 text-red-500 dark:bg-red-900/10">
              <i class="fas fa-sign-out-alt"></i>
            </div>
            <span class="font-bold">Logout</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
