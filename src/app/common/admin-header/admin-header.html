<header class="fixed h-16 top-0 left-0 right-0 z-50 flex items-center justify-between px-4 py-2 bg-white shadow-md transition-colors duration-300 ease-in-out">
  <div class="flex items-center">
    <img src="/logo/logo.png" alt="Fobverse Logo" class="h-10 mr-4">
  </div>
  <div class="flex items-center space-x-4">
    <button (click)="toggleDarkMode()" class="p-2 rounded-full transition-colors duration-200 hover:bg-purple-50" aria-label="Toggle dark mode">
      <i class="fas" [ngClass]="{'fa-moon text-gray': !isDarkMode, 'fa-sun text-white': isDarkMode}"></i>
    </button>
    <div class="relative">
      <button (click)="toggleProfileMenu()" class="flex items-center p-2 rounded-full transition-colors duration-200 hover:bg-purple-50">
        <img [src]="activeAdmin?.profileImg ? cludBaseUrl+activeAdmin?.profileImg:'/profileimages/defaultProfile.jpg'" alt="User Avatar" class="h-8 w-8 rounded-full">
      </button>
      <div *ngIf="isProfileMenuOpen" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-10 border border-divider">
        <a [routerLink]="['/admin/profile']" class="block px-4 py-2 text-sm text-dark-gray hover:bg-purple-50">Profile</a>
        <a href="#" class="block px-4 py-2 text-sm text-dark-gray hover:bg-purple-50">Settings</a>
        <a (click)="logoutUser()" class="block px-4 py-2 text-sm text-red-500 hover:bg-purple-50 cursor-pointer">Logout</a>
      </div>
    </div>
  </div>
</header>
