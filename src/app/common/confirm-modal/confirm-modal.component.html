<div class="confirm-overlay" *ngIf="isOpen" (click)="handleCancel()" (keydown.escape)="handleCancel()" tabindex="-1">
  <div class="confirm-card" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()" [ngClass]="getTypeClass()" role="dialog" aria-modal="true" tabindex="0">
    <div class="confirm-header">
      <div class="confirm-icon">
        <i [class]="getIcon()"></i>
      </div>
      <h3 class="confirm-title">{{ options?.title }}</h3>
    </div>
    
    <div class="confirm-body">
      <p class="confirm-message">{{ options?.message }}</p>
    </div>
    
    <div class="confirm-footer">
      <button class="btn-cancel" (click)="handleCancel()">
        {{ options?.cancelText || 'Cancel' }}
      </button>
      <button class="btn-confirm" (click)="handleConfirm()">
        {{ options?.confirmText || 'Confirm' }}
      </button>
    </div>
  </div>
</div>
